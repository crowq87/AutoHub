<style>
/* ===== Admin panel (shared by Overview + Users) ===== */
.ad-wrap { max-width: 1320px; }

.ad-header { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; }
.ad-title { font-size:1.65rem; font-weight:800; margin:0; letter-spacing:-.02em; color:var(--text-primary); }
.ad-sub { color:var(--text-muted); font-size:.9rem; margin:.15rem 0 0; }

.ad-tabs { display:flex; gap:.25rem; border-bottom:1px solid var(--border); margin-bottom:1.5rem; overflow-x:auto; }
.ad-tab { display:inline-flex; align-items:center; gap:.45rem; padding:.7rem 1rem; font-weight:600; font-size:.9rem;
  color:var(--text-muted); text-decoration:none; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.ad-tab:hover { color:var(--text-primary); }
.ad-tab.active { color:var(--orange); border-bottom-color:var(--orange); }
.ad-tab .ad-count { background:var(--orange); color:#fff; border-radius:20px; font-size:.68rem; padding:1px 7px; font-weight:700; }

/* KPI cards */
.ad-kpi { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--card-shadow);
  padding:1.1rem 1.15rem; height:100%; display:flex; flex-direction:column; gap:.55rem; }
.ad-kpi-top { display:flex; align-items:center; justify-content:space-between; }
.ad-kpi-label { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
.ad-kpi-icon { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
.ad-kpi-value { font-size:2rem; font-weight:800; line-height:1; color:var(--text-primary); letter-spacing:-.03em; }
.ad-kpi-foot { font-size:.78rem; color:var(--text-muted); display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
.ad-kpi-foot a { color:inherit; text-decoration:underline dotted; }

.ad-trend { display:inline-flex; align-items:center; gap:.2rem; font-weight:700; font-size:.74rem; padding:2px 8px; border-radius:20px; }
.ad-trend.up   { background:rgba(16,185,129,.14); color:#10b981; }
.ad-trend.down { background:rgba(239,68,68,.14);  color:#ef4444; }
.ad-trend.flat { background:rgba(148,163,184,.18); color:var(--text-muted); }

.tint-blue   { background:rgba(37,99,235,.13);  color:#3b82f6; }
.tint-orange { background:rgba(249,115,22,.14); color:#f97316; }
.tint-green  { background:rgba(16,185,129,.14); color:#10b981; }
.tint-purple { background:rgba(139,92,246,.14); color:#8b5cf6; }
.tint-red    { background:rgba(239,68,68,.14);  color:#ef4444; }

/* Cards */
.ad-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--card-shadow); height:100%; }
.ad-card-head { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:1rem 1.25rem .25rem; flex-wrap:wrap; }
.ad-card-title { font-weight:700; font-size:.98rem; margin:0; color:var(--text-primary); }
.ad-card-sub { font-size:.78rem; color:var(--text-muted); margin:0; }
.ad-card-body { padding:.75rem 1.25rem 1.25rem; }
.ad-card-body.flush { padding:0; }

.ad-chart { position:relative; height:290px; }
.ad-chart.sm { height:230px; }
.ad-empty { display:none; position:absolute; inset:0; align-items:center; justify-content:center; flex-direction:column;
  color:var(--text-muted); font-size:.85rem; gap:.35rem; }
.ad-empty i { font-size:1.6rem; opacity:.6; }

/* Tables */
.ad-table { margin:0; font-size:.88rem; }
.ad-table thead th { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700; padding:.75rem 1rem; white-space:nowrap; }
.ad-table td { padding:.8rem 1rem; vertical-align:middle; }
.ad-user { display:flex; align-items:center; gap:.7rem; min-width:210px; }
.ad-avatar { width:38px; height:38px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.ad-avatar-ph { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg-subtle); color:var(--text-muted); font-weight:700; font-size:.85rem; }
.ad-user-name { font-weight:700; color:var(--text-primary); line-height:1.2; }
.ad-user-meta { font-size:.76rem; color:var(--text-muted); }

/* Soft badges */
.ad-badge { display:inline-flex; align-items:center; gap:.3rem; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
.ad-badge.green  { background:rgba(16,185,129,.15); color:#10b981; }
.ad-badge.amber  { background:rgba(245,158,11,.16); color:#d97706; }
.ad-badge.red    { background:rgba(239,68,68,.15);  color:#ef4444; }
.ad-badge.blue   { background:rgba(59,130,246,.15); color:#3b82f6; }
.ad-badge.purple { background:rgba(139,92,246,.15); color:#8b5cf6; }
.ad-badge.gray   { background:rgba(148,163,184,.2); color:var(--text-muted); }
[data-bs-theme="dark"] .ad-badge.amber { color:#fbbf24; }

/* Row actions */
.ad-actions { display:flex; gap:.35rem; justify-content:flex-end; }
.ad-icon-btn { width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-muted);
  display:inline-flex; align-items:center; justify-content:center; font-size:.9rem; cursor:pointer; transition:.15s; text-decoration:none; padding:0; }
.ad-icon-btn:hover { color:var(--text-primary); background:var(--bg-subtle); }
.ad-icon-btn.warn:hover   { color:#d97706; border-color:rgba(245,158,11,.5); background:rgba(245,158,11,.1); }
.ad-icon-btn.danger:hover { color:#ef4444; border-color:rgba(239,68,68,.5);  background:rgba(239,68,68,.1); }
.ad-icon-btn.ok:hover     { color:#10b981; border-color:rgba(16,185,129,.5); background:rgba(16,185,129,.1); }
.ad-protected { font-size:.76rem; color:var(--text-muted); display:inline-flex; align-items:center; gap:.3rem; }

/* Queue / attention */
.ad-queue-count { background:rgba(245,158,11,.16); color:#d97706; font-weight:800; border-radius:20px; padding:2px 10px; font-size:.78rem; }
[data-bs-theme="dark"] .ad-queue-count { color:#fbbf24; }
.ad-allclear { display:flex; align-items:center; gap:.9rem; padding:1.1rem 1.25rem; }
.ad-allclear i { font-size:1.6rem; color:#10b981; }

/* Filter bar */
.ad-filter { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; padding:1rem 1.25rem; border-bottom:1px solid var(--border); }
.ad-filter .form-control, .ad-filter .form-select { font-size:.88rem; }
.ad-search { position:relative; flex:1 1 260px; }
.ad-search i { position:absolute; left:.8rem; top:50%; transform:translateY(-50%); color:var(--text-muted); }
.ad-search input { padding-left:2.2rem; }

.ad-pager { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.9rem 1.25rem; border-top:1px solid var(--border); flex-wrap:wrap; font-size:.84rem; color:var(--text-muted); }
.ad-pager .pagination { margin:0; }

.ad-chipstat { display:flex; align-items:center; gap:.7rem; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:.7rem 1rem; box-shadow:var(--card-shadow); }
.ad-chipstat b { font-size:1.35rem; font-weight:800; color:var(--text-primary); line-height:1; }
.ad-chipstat span { font-size:.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
</style>
